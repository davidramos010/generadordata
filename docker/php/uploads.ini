; Límites para el conversor Base64 ↔ PDF (PDF de hasta 10 MB ≈ 13,4 MB en Base64)
upload_max_filesize = 11M
post_max_size = 16M
memory_limit = 256M
max_execution_time = 30

; Los avisos de PHP no deben salir en la respuesta (rompen el JSON y revelan rutas internas)
display_errors = Off
log_errors = On
